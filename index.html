<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft 模组官网</title>

    <!-- Modern CSS Framework (Tailwind CSS for quick design) -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Custom Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        html {
            scroll-behavior: smooth; /* 设置全局的平滑滚动 */
        }
        body {
            font-family: 'Roboto', sans-serif;
        }
    </style>

    <!-- JavaScript -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // 高亮当前导航项
            const navLinks = document.querySelectorAll("nav a");
            navLinks.forEach(link => {
                link.addEventListener("click", function (e) {
                    e.preventDefault(); // 阻止默认跳转
                    navLinks.forEach(l => l.classList.remove("text-blue-500"));
                    this.classList.add("text-blue-500");

                    // 获取跳转目标的id并滚动到该元素
                    const targetId = this.getAttribute("href").substring(1);
                    const targetElement = document.getElementById(targetId);
                    
                    if (targetElement) {
                        targetElement.scrollIntoView({
                            behavior: "smooth", // 平滑滚动
                            block: "start"      // 滚动到元素顶部
                        });
                    }
                });
            });

            // 点击下载按钮显示加载动画
            const downloadButton = document.getElementById("download-button");
            downloadButton.addEventListener("click", () => {
                downloadButton.textContent = "下载中...";
                downloadButton.disabled = true;

                // 假装执行下载操作 2 秒后恢复按钮状态
                setTimeout(() => {
                    downloadButton.textContent = "立即下载";
                    downloadButton.disabled = false;
                }, 2000);
            });
        });
    </script>

</head>
<body class="bg-gray-100">
    <!-- Navigation Bar -->
    <header class="bg-white border-b shadow-md">
        <div class="container mx-auto flex items-center justify-between px-6 py-4">
            <div>
                <a href="#" class="text-2xl font-bold text-gray-900">我的世界 模组</a>
            </div>
            <nav class="space-x-4">
                <a href="#features" class="hover:underline text-gray-600">功能介绍</a>
                <a href="#download" class="hover:underline text-gray-600">下载</a>
                <a href="#contact" class="hover:underline text-gray-600">联系我们</a>
            </nav>
        </div>
    </header>

    <!-- Hero Section -->
    <section class="relative bg-gradient-to-r from-green-400 to-blue-500 text-white">
        <div class="container mx-auto flex flex-col items-center justify-center h-96">
            <h1 class="text-5xl font-bold text-center">打造你的专属世界</h1>
            <p class="text-xl mt-4 text-center max-w-xl">探索终极我的世界模组，自定义你的游戏体验，发现无尽可能。</p>
            <div class="mt-6">
                <a href="#download" class="px-6 py-2 bg-white text-lg text-blue-700 rounded-lg shadow-lg hover:bg-gray-200">立刻开始</a>
            </div>
        </div>
    </section>

    <!-- Features Section -->
    <section id="features" class="py-16 bg-white">
        <div class="container mx-auto px-6">
            <h2 class="text-4xl font-bold text-center mb-8 text-gray-900">功能介绍</h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-10">
                <div class="bg-gray-100 p-6 rounded-lg shadow-md text-center">
                    <h3 class="text-2xl font-bold mb-4">无限维度</h3>
                    <p class="text-gray-600">探索无尽的全新维度和独特世界，为你量身打造。</p>
                </div>
                <div class="bg-gray-100 p-6 rounded-lg shadow-md text-center">
                    <h3 class="text-2xl font-bold mb-4">自定义生物</h3>
                    <p class="text-gray-600">增加你自己的生物和怪物，让游戏内容更加丰富多彩。</p>
                </div>
                <div class="bg-gray-100 p-6 rounded-lg shadow-md text-center">
                    <h3 class="text-2xl font-bold mb-4">增强玩法</h3>
                    <p class="text-gray-600">解锁全新能力、工具和方块，让建造与生存更加轻松。</p>
                </div>
            </div>
        </div>
    </section>

    <!-- Download Section -->
    <section id="download" class="py-16 bg-gradient-to-r from-gray-700 to-gray-900 text-white">
        <div class="container mx-auto px-6 text-center">
            <h2 class="text-4xl font-bold mb-6">立即下载</h2>
            <p class="mb-8 text-lg max-w-3xl mx-auto">从本站获取最新模组版本。安装简单，功能强大。</p>
            <button id="download-button" class="px-6 py-2 bg-green-500 text-white text-lg rounded-lg shadow-lg hover:bg-green-600">立即下载</button>
        </div>
    </section>

    <!-- Footer -->
    <footer id="contact" class="bg-gray-900 text-gray-400 py-8">
        <div class="container mx-auto px-6 text-center">
            <p>&copy; 2026 我的世界模组 - 版权所有。</p>
            <p>用 ❤️ 为玩家社区倾情打造。</p>
        </div>
    </footer>
</body>
</html>
