<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D Minecraft 简易版</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #87CEEB;
        }

        h1 {
            font-family: Arial, sans-serif;
            text-align: center;
            color: #333;
        }

        .game-container {
            display: grid;
            grid-template-rows: repeat(20, 20px);
            grid-template-columns: repeat(30, 20px);
            gap: 1px;
            background-color: #333;
        }

        .block {
            width: 20px;
            height: 20px;
            background-color: #228B22; /* 草地颜色 */
            box-sizing: border-box;
        }

        .dirt {
            background-color: #8B4513; /* 泥土颜色 */
        }

        .stone {
            background-color: #696969; /* 石头颜色 */
        }

        .sky {
            background-color: #87CEEB; /* 天空颜色 */
        }
    </style>
</head>
<body>
    <h1>2D Minecraft 简易版</h1>
    <p>点击方块可以“挖掘”，右键可以“放置”。</p>
    <div class="game-container" id="gameContainer"></div>
    <script>
        // 设置游戏网格
        const gameContainer = document.getElementById('gameContainer');
        const rows = 20;
        const cols = 30;
        const skyRow = 5; // 天空的行数

        // 初始化游戏网格
        for (let i = 0; i < rows; i++) {
            for (let j = 0; j < cols; j++) {
                const block = document.createElement('div');
                // 设置背景：顶部为天空，中间为泥土，底部为石头
                if (i < skyRow) {
                    block.className = 'block sky';
                } else if (i < rows - 3) {
                    block.className = 'block dirt';
                } else {
                    block.className = 'block stone';
                }
                block.addEventListener('click', () => digBlock(block)); // 左键挖掘方块
                block.addEventListener('contextmenu', (e) => {
                    e.preventDefault();
                    placeBlock(block); // 右键放置方块
                });
                gameContainer.appendChild(block);
            }
        }

        // 挖掘方块（变为天空）
        function digBlock(block) {
            if (!block.classList.contains('sky')) {
                block.className = 'block sky';
            }
        }

        // 放置方块（默认放泥土）
        function placeBlock(block) {
            if (block.classList.contains('sky')) {
                block.className = 'block dirt';
            }
        }
    </script>
</body>
</html>
